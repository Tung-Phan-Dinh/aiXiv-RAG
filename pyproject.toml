[project]
name = "aixiv-rag"
version = "0.1.0"
description = "Corpus-ablation harness: how do RAG answers change when the underlying data changes?"
readme = "README.md"
authors = [
    { name = "Tung-Phan-Dinh", email = "andrephan.work@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[project.scripts]
aixiv-rag = "rageblate.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv.build-backend]
module-name = "rageblate"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
