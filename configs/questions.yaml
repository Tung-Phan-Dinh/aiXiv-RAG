# Hand-written evaluation questions. `topic` names the topic (topics.yaml) whose documents are
# expected to carry the evidence; null = control question. A question is "targeted" in a
# snapshot that removes its topic. Editing this file changes the run's questions_hash.
questions:
  - id: q01
    topic: sea_ice
    question: "How does the loss of Arctic sea ice affect atmospheric circulation and mid-latitude weather?"
  - id: q02
    topic: sea_ice
    question: "What mechanisms drive the retreat of Antarctic ice shelves and what are the consequences for sea level?"

  - id: q03
    topic: earthquakes
    question: "What statistical laws describe the temporal decay of aftershock sequences?"
  - id: q04
    topic: earthquakes
    question: "How do fault zone properties control whether slip occurs as earthquakes or as slow aseismic creep?"

  - id: q05
    topic: enso
    question: "How does El Nino influence global mean temperature and regional rainfall?"
  - id: q06
    topic: enso
    question: "What physical mechanisms determine the irregular period of ENSO events?"

  - id: q07
    topic: climate_forcing
    question: "How large is the equilibrium climate sensitivity to a doubling of atmospheric carbon dioxide?"
  - id: q08
    topic: climate_forcing
    question: "What are the main contributions of greenhouse gases and aerosols to radiative forcing?"

  - id: q09
    topic: machine_learning
    question: "How are neural networks used to emulate or parameterize processes in weather and climate models?"
  - id: q10
    topic: machine_learning
    question: "Which machine learning methods have been applied to seismic signal detection or earthquake forecasting?"

  - id: q11
    topic: turbulence
    question: "How does turbulence in the atmospheric boundary layer control the transport of heat and momentum?"
  - id: q12
    topic: turbulence
    question: "What is known about the energy spectrum and cascade of geophysical turbulence in the ocean and atmosphere?"

  - id: q13
    topic: mantle_core
    question: "How does mantle convection couple to plate motion and subduction?"
  - id: q14
    topic: mantle_core
    question: "What do models say about the thermal evolution of the Earth's core and the geodynamo?"

  - id: q15
    topic: ocean_circulation
    question: "What controls the strength and variability of the Atlantic meridional overturning circulation?"
  - id: q16
    topic: ocean_circulation
    question: "What sets the strength and structure of the abyssal overturning cell and Antarctic Bottom Water formation?"

  # controls: evidence is not tied to any removable topic
  - id: q17
    topic: null
    question: "How are ocean tides dissipated and what role does internal tide generation play?"
  - id: q18
    topic: null
    question: "What approaches exist for assimilating observations into numerical weather prediction models?"
  - id: q19
    topic: null
    question: "How do changes in atmospheric angular momentum affect the length of day?"
  - id: q20
    topic: null
    question: "How do aerosols and cloud microphysics influence precipitation formation?"

