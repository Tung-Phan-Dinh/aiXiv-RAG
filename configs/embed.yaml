# Embedders, selected by tag: `aixiv-rag embed --embedder <tag>` or $RAGEBLATE_EMBEDDER.
# Vectors live in data/embeddings/<tag>/. Do NOT swap the model mid-project: a different
# model invalidates every cached result (it is a full re-run, not a tweak).
default: bge-small

# Exactly what is embedded for each document. Part of the config hash.
doc_template: "{title}. {abstract}"

embedders:
  bge-small:
    backend: sentence-transformers
    model: BAAI/bge-small-en-v1.5
    batch_size: 64
    # bge expects this prefix on QUERIES only, never on documents.
    query_prefix: "Represent this sentence for searching relevant passages: "

  # Offline, dependency-free, deterministic. For tests / dry runs. NOT for research results.
  hash-1024:
    backend: hash
    dim: 1024
    query_prefix: ""
